name: rolidecks
description: "Rolidecks — a portrait card-stack home launcher for the iKKO Mind One: a rolodex of coloured cards, each a folder of apps."
publish_to: 'none'

version: 1.0.21+22

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Lexend, bundled rather than fetched with google_fonts: a launcher must
    # draw its own labels without a network, and a first-run flash of a
    # fallback font on the home screen would be the first thing you see.
    # Variable font (a single wght axis file) under the SIL Open Font Licence
    # 1.1 — assets/fonts/OFL.txt.
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend[wght].ttf
